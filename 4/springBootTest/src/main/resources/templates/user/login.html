<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户登录</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #1c0d16, #2a1120 60%, #3a1424);
            color: #ffeef2;
        }
        .card {
            width: min(420px, 92vw);
            padding: 32px 30px 26px;
            border-radius: 18px;
            background: rgba(46, 16, 30, .62);
            border: 1px solid rgba(255, 178, 199, .2);
            box-shadow: 0 24px 60px rgba(20, 4, 12, .6);
        }
        h2 {
            margin: 0 0 6px;
            font-size: 22px;
            letter-spacing: 4px;
            text-align: center;
            color: #ff9eb5;
        }
        .sub {
            margin: 0 0 22px;
            font-size: 12px;
            letter-spacing: 2px;
            text-align: center;
            color: #c79aa9;
        }
        .field { margin-bottom: 14px; }
        label {
            display: block;
            margin-bottom: 7px;
            font-size: 12.5px;
            letter-spacing: 1px;
            color: #c79aa9;
        }
        input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            font-size: 14.5px;
            color: #ffeef2;
            background: rgba(255, 240, 244, .05);
            border: 1px solid rgba(255, 178, 199, .22);
            border-radius: 12px;
            outline: 0;
            transition: border-color .25s, box-shadow .25s;
        }
        input:focus {
            border-color: rgba(255, 92, 122, .65);
            box-shadow: 0 0 0 3px rgba(255, 92, 122, .14);
        }
        button {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #451020;
            cursor: pointer;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff9eb5, #ff5c7a 70%, #f7b26b);
            box-shadow: 0 12px 26px rgba(255, 92, 122, .34);
            transition: transform .15s, filter .25s;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.04); }
        button:active { transform: translateY(0); }
        .msg {
            margin: 0 0 16px;
            padding: 10px 14px;
            font-size: 12.5px;
            border-radius: 10px;
            color: #ff4d6d;
            background: rgba(255, 77, 109, .12);
            border: 1px solid rgba(255, 77, 109, .45);
        }
        .tip {
            margin: 18px 0 0;
            font-size: 11.5px;
            line-height: 1.9;
            text-align: center;
            color: #c79aa9;
        }
        .tip b { color: #ffd9a0; font-weight: 600; }
    </style>
</head>
<body>
<main class="card">
    <h2>用户登录</h2>
    <p class="sub">SPRING MVC · 传统表单登录</p>

    <!-- 登录失败提示（UserController 回填 msg） -->
    <p class="msg" th:if="${msg}" th:text="${msg}">账号或密码错误</p>

    <form action="login" method="post">
        <div class="field">
            <label for="username">用户名:</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="field">
            <label for="password">密码:</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit">登 录</button>
    </form>

    <p class="tip">
        可用项目统一账号 <b>admin / 123456</b>，或教学演示口令 <b>123</b>
    </p>
</main>
</body>
</html>
